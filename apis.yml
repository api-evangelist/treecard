aid: treecard
name: Treecard
description: Treecard was a Seedcamp-backed "walk to plant" climate consumer company
  that funded reforestation from everyday activity, originally through a wooden
  debit card and later a step-tracking mobile app. The company has shut down, and
  treecard.org now serves a closing notice thanking members and reporting
  10,037,912 trees funded and 2,931,070 lifetime tons of carbon, pointing former
  users to Ecosia and Treekly while its planting projects live on at
  impact.veritree.com/treecard. Treecard published no public API, developer
  program, or machine-readable API artifacts.
